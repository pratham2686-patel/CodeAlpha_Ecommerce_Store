{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 3rem auto; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2rem;">
  <h2 style="margin-bottom: 1rem;">Edit Your Review</h2>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Rating</label>
      {{ form.rating }}
    </div>
    <div class="form-group">
      <label class="form-label">Comment</label>
      {{ form.comment }}
    </div>
    <button type="submit" class="btn-primary">Update Review</button>
    <a href="{% url 'store:product_detail' slug=review.product.slug %}" class="btn-compact" style="background: var(--bg-input); color: var(--text-muted); margin-top: 0.5rem;">Cancel</a>
  </form>
</div>
{% endblock %}
