{% extends 'base.html' %}

{% block title %}Sign In - ElectroMart{% endblock %}

{% block content %}

<div class="auth-container">
  <h1 class="auth-title">Welcome Back</h1>
  <p class="auth-subtitle">Sign in to your ElectroMart account</p>

  <form method="post" action="{% url 'store:login' %}">
    {% csrf_token %}

    <div class="form-group">
      <label class="form-label" for="id_username">Username</label>
      <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="id_password">Password</label>
      <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
      <i class="fas fa-sign-in-alt"></i> Sign In
    </button>
  </form>

  <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
    Don't have an account yet? 
    <a href="{% url 'store:register' %}" style="color: #818cf8; font-weight: 600;">Create an account</a>
  </p>
</div>

{% endblock %}
